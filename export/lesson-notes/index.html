<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Lesson Note Dashboard | Schoolgate ERP</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">Schoolgate ERP</div>
        <nav>
            <a href="#">Dashboard</a>
            <a href="#" class="active">Lesson Notes</a>
        </nav>
    </header>
    <main>
        <section class="kpi-cards">
            <div class="card"><h3>Total Notes</h3><p>124</p></div>
            <div class="card"><h3>Approved</h3><p>98</p></div>
            <div class="card"><h3>Pending</h3><p>15</p></div>
            <div class="card"><h3>Curriculum</h3><p>85%</p></div>
        </section>
        <section class="editor-area">
            <h1>Teacher Lesson Note</h1>
            <form>
                <div class="form-group"><label>Topic</label><input type="text"></div>
                <div class="form-group"><label>Learning Objectives</label><textarea></textarea></div>
            </form>
        </section>
    </main>
</body>
</html>
